name: Deploy MkDocs (Docs + Embed)

on:
    push:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  pip install -r requirements.txt

            - name: Build normal docs
              run: |
                  mkdocs build --strict

            - name: Build embed (headless) docs
              run: |
                  mkdocs build \
                    -f mkdocs.embed.yml \
                    -d site/embed

            # Only upload the Pages artifact when deploying (main branch or manual trigger)
            - name: Upload Pages artifact
              if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        # Only deploy to GitHub Pages from main or a manual trigger
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
