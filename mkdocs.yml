site_name: Docs
site_url: https://msd-live.github.io/msdlive-docs/

theme:
  name: carbon
  logo: assets/MSD.LIVE.STACK.png
  favicon: assets/favicon.ico
  theme_toggle: false
  custom_dir: docs/overrides

plugins:
  - search
  - glightbox:
      shadow: true
      caption_position: bottom
      auto_caption: true
      touchNavigation: false
      background: black

extra:
  favicon: assets/favicon.ico

extra_css:
  - styles/carbon-customizations.css

extra_javascript:
  - javascripts/carbon-nav-scroll-fix.js

nav:
  - Getting Started:
      - About: platform_community/about.md
      - Quick Start: index.md
      - Create an Account: getting_started/create_account.md
      - Log In and Join a Project: getting_started/login_join_project.md
      - Policies: platform_community/policies.md
  - For Data Users:
      - Find Data: for_data_users/dataset_search.md
      - Explore Data:
          - About: for_data_users/explore_data_about.md
          - Quick Start: for_data_users/explore_data_quick_start.md
          - Launch the Environment: for_data_users/launch_environment.md
          - Create Notebooks: for_data_users/create_notebook.md
          - Share Notebooks: for_data_users/share_notebooks.md
          - Access Multiple Datasets: for_data_users/access_multiple_datasets.md
          - Use the Scratch Directory: for_data_users/use_scratch_directory.md
      - Download Data:
          - Download Published Datasets: for_data_users/download_datasets.md
          - Download Notebook Results: for_data_users/download_notebook_results.md
  - For Data Providers:
      - Create a Dataset: for_data_providers/create_dataset.md
      - Upload Your Dataset: for_data_providers/upload_dataset.md
      - Enable Exploration:
          - About: for_data_providers/exploration_overview.md
          - Enable Data Exploration: for_data_providers/enable_exploration.md
          - Set Up a Notebook Repository: for_data_providers/setup_notebook_repository.md
          - Launch the Environment: for_data_providers/launch_notebook_environment.md
          - Create Notebooks: for_data_providers/create_example_notebooks.md
          - Share Notebooks: for_data_providers/share_notebooks.md
          - Manage Storage: for_data_providers/manage_storage.md
  - Tools & Services:
      - Command Line Tool (CLI):
          - Installing the CLI: tools_services/cli/installation.md
          - Use the CLI: tools_services/cli/usage.md
          - Running Behind a Proxy: tools_services/cli/proxy_setup.md
      - Computational Resources: tools_services/computational_resources.md
      - Interactive Dashboards: tools_services/interactive_dashboards.md
      - Model Training Notebooks: tools_services/model_training_notebooks.md
  - Learning Resources:
      - Video Tutorials: learning_resources/tutorials.md
      - Articles: learning_resources/articles.md
      - Webinars: learning_resources/webinars.md

# Extensions
markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 2
