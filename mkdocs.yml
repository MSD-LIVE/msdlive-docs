site_name: Docs
site_url: https://msd-live.github.io/msdlive-docs/

theme:
  name: carbon
  logo: assets/MSD.LIVE.STACK.png
  favicon: assets/favicon.ico
  theme_toggle: false
  custom_dir: docs/overrides

plugins:
  - search
  - glightbox:
      shadow: true
      caption_position: bottom
      auto_caption: true
      touchNavigation: false
      background: black

extra:
  favicon: assets/favicon.ico

extra_css:
  - styles/carbon-customizations.css

extra_javascript:
  - javascripts/carbon-nav-scroll-fix.js

nav:
  - Getting Started:
      - About: platform_community/about.md
      - Quick Start: index.md
      - Create an Account: about/create_account.md
      - Log In and Join a Project: about/login_join_project.md
      - Policies: platform_community/policies.md

      # - Find and Explore Data: getting_started/find_explore_data.md
      # - Download Data: getting_started/download_data.md
  - For Data Users:
      - Find Data:
          - Dataset Search: for_data_users/what_you_can_doxx.md
      - Explore Data:
          - About: for_data_users/what_you_can_do.md
          - Launch the Environment: for_data_users/launch_environment.md
          - Create Notebooks: for_data_users/create_notebook.md
          - Share Notebooks: for_data_users/contribute_back.md
          # - Install Dependencies: for_data_users/install_dependencies.md
          # - Load Data: for_data_users/load_data.md
          # - Analyze and Visualize: for_data_users/analyze_visualize.md
          - Access Multiple Datasets: for_data_users/access_multiple_datasets.md
          - Use the Scratch Directory: for_data_users/use_scratch_directory.md
      - Download Data:
          - Download Published Datasets: for_data_users/download_datasets.md
          - Download Notebook Results: for_data_users/download_notebook_results.md
          # - Advanced Options: for_data_users/download_advanced_options.md
  - For Data Providers:
      - Create a Dataset: for_data_providers/spatial_metadata.md
      - Upload Your Dataset: for_data_providers/upload_dataset.md
      - Enable Exploration:
          - About: for_data_providers/overview.md
          - Enable Data Exploration: for_data_providers/enable_exploration.md
          - Set Up a Notebook Repository: for_data_providers/setup_notebook_repository.md
          - Launch the Environment: for_data_providers/use_notebook_lab.md
          - Create Notebooks: for_data_providers/create_example_notebooks.md
          # - Install Dependencies: for_data_providers/install_dependencies.md
          # - Load Data: for_data_providers/load_data.md
