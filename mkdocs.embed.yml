INHERIT: mkdocs.yml

theme:
  custom_dir: docs/overrides/embed
  name: carbon
  theme_default: white

plugins:
  - search
  - glightbox:
      shadow: true
      caption_position: bottom
      auto_caption: true
      touchNavigation: false
      background: black
  - open-in-new-tab

extra_css:
  - styles/carbon-customizations.css
  - styles/embed.css

extra_javascript:
  - javascripts/embed-links-fix.js
  - javascripts/carbon-nav-scroll-fix.js